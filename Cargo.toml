[package]
name = "ddr5-memtest"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
colored = "2"
rayon = "1"
libc = "0.2"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
